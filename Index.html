<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalender</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#F4F7F6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7F6;--sf:#fff;--ink:#14282A;--mu:#5F7476;--ln:#DDE6E4;--ac:#1E6F68;--as:#E3F0EE;--on:#fff;--c0:#2F7F9E;--c1:#D08A52;--c2:#5E9E86;--c3:#8A86B8;--sh:0 1px 2px rgba(20,40,42,.04),0 14px 34px -14px rgba(20,40,42,.14);--se:'Newsreader',Georgia,serif}
@media(prefers-color-scheme:dark){:root{--bg:#0E1718;--sf:#142123;--ink:#E6F0EE;--mu:#8DA5A2;--ln:#243638;--ac:#5FC2B6;--as:#173432;--on:#0E1718;--sh:0 14px 34px -14px rgba(0,0,0,.6)}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nav{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nv{flex:1;min-height:58px;color:var(--mu);font-size:11.5px;font-weight:500}.nv.on{color:var(--ac);font-weight:600}.brand{display:none}
main{max-width:900px;margin:0 auto;padding:20px 18px 160px}
input,select,textarea{padding:10px 14px;min-height:46px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ac);outline:0;box-shadow:0 0 0 3px var(--as)}
input[type=checkbox]{width:20px;min-height:20px;accent-color:var(--ac)}
h2{font:400 32px/1.15 var(--se);letter-spacing:-.015em;margin:0}h3{font-size:15px;font-weight:600;margin:0 0 6px}.dh{font:400 21px var(--se);color:var(--ink);margin:30px 0 4px}
.bar{display:flex;justify-content:space-between;align-items:center;margin:26px 0 8px;gap:8px}.bar div{display:flex;gap:2px}
.ib{min-width:46px;min-height:46px;border-radius:999px;color:var(--mu)}.ib:hover{background:var(--as);color:var(--ac)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--ln);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--mu);min-height:34px;background:var(--sf)}.chip.on{background:var(--as);color:var(--ac);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:var(--sh)}
.wd{background:var(--sf);text-align:center;color:var(--mu);font-size:12px;padding:10px 0}
.cell{min-height:56px;background:var(--sf);padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;overflow:hidden;text-align:left}
.cell.out{opacity:.4}.cell b{font-weight:500;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;font-size:13px}
.cell.today b{background:var(--ac);color:var(--on)}.cell.sel{background:var(--as)}
.dots{display:flex;gap:3px;padding-left:4px}.dots i{width:6px;height:6px;border-radius:3px}
.cell em{display:none;font-style:normal;font-size:11.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;margin-top:8px}
.bar1{width:3px;align-self:stretch;border-radius:2px;flex:none}
.rb{flex:1;text-align:left;display:flex;flex-direction:column;min-width:0;min-height:40px;justify-content:center}.tm{font-size:12.5px;color:var(--mu);font-variant-numeric:tabular-nums}
.rb small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{font-size:11.5px;color:var(--ac);background:var(--as);border-radius:999px;padding:2px 10px;flex:none}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mu);flex:none}.ck.d{background:var(--ac);border-color:var(--ac)}.strike{text-decoration:line-through;color:var(--mu)}
.empty,.hint{color:var(--mu);margin:12px 0}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;margin-top:16px;display:grid;gap:14px;box-shadow:var(--sh)}
.notes{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:12px}
.note{text-align:left;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px}.note p{margin:6px 0 0;color:var(--mu);white-space:pre-wrap}
label{display:grid;gap:5px;font-size:13px;color:var(--mu)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inl{display:flex;gap:8px}
label.chk{display:flex;align-items:center;gap:8px}
.pri{background:var(--ac);color:var(--on);border-radius:999px;padding:0 24px;min-height:46px;font-weight:600}
.sec{border:1px solid var(--ln);border-radius:999px;padding:0 18px;min-height:46px;color:var(--ink);background:var(--sf)}.sec:hover{border-color:var(--ac);color:var(--ac)}.danger{color:#B4423F;min-height:46px;padding:0 8px}
.prow{display:grid;grid-template-columns:24px 1fr 1fr;gap:6px;align-items:center}.prow [data-f=title]{grid-column:2/4}.prow small{grid-column:2/4;color:var(--mu)}
.tl{position:relative;margin:22px 0 0 50px}.hr{position:absolute;left:0;right:0;border-top:1px solid var(--ln)}.hr span{position:absolute;left:-50px;top:-10px;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.blk{position:absolute;text-align:left;background:color-mix(in srgb,var(--k) 15%,var(--sf));border-left:3px solid var(--k);border-radius:10px;padding:5px 10px;overflow:hidden;display:flex;flex-direction:column;font-size:13.5px;line-height:1.3;z-index:1}
.blk small{color:var(--mu);font-size:12px}.nowl{position:absolute;left:-6px;right:0;border-top:2px solid var(--ac);z-index:2}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ac);color:var(--on);font-size:28px;z-index:6;box-shadow:var(--sh)}
dialog{border:0;border-radius:26px;padding:24px;width:min(460px,calc(100% - 24px));background:var(--sf);color:var(--ink);box-shadow:var(--sh)}dialog::backdrop{background:rgba(10,24,24,.45)}
#f{display:grid;gap:14px}.btns{display:flex;gap:8px}.btns span{flex:1}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px}.seg button{flex:1;min-height:40px;border-radius:999px;color:var(--mu)}.seg .on{background:var(--sf);color:var(--ac);font-weight:600;box-shadow:0 1px 3px rgba(20,40,42,.12)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;z-index:9;max-width:90%}
@media(min-width:760px){body{padding-left:220px}.nav{top:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:34px 14px;gap:2px}
.brand{display:block;font:400 28px var(--se);padding:0 14px 26px;letter-spacing:-.01em}
.nv{flex:none;text-align:left;padding:0 16px;min-height:46px;border-radius:999px;font-size:15px}.nv.on{background:var(--as)}
.cell{min-height:96px}.cell em{display:block}.dots{display:none}.fab{bottom:30px;right:30px}#toast{bottom:32px}
.prow{grid-template-columns:24px 1fr 140px 100px}.prow [data-f=title]{grid-column:auto}.prow small{grid-column:2/5}}
</style></head><body>
<nav class="nav"><div class="brand">Kalender</div><button class="nv" data-v="month">Monat</button><button class="nv" data-v="day">Tag</button><button class="nv" data-v="agenda">Agenda</button><button class="nv" data-v="tasks">Aufgaben</button><button class="nv" data-v="notes">Notizen</button><button class="nv" data-v="import">Import</button></nav>
<main><div class="top"><input id="q" type="search" placeholder="Termine, Aufgaben und Notizen suchen" aria-label="Suchen"></div><div id="main"></div></main>
<button class="fab" data-act="add" aria-label="Neu anlegen">+</button><div id="toast" hidden></div>
<dialog id="dlg"><form id="f">
<div class="seg" id="seg"><button type="button" data-ty="e">Termin</button><button type="button" data-ty="t">Aufgabe</button><button type="button" data-ty="n">Notiz</button></div>
<label>Titel<input id="ft" required></label>
<label data-for="e t">Datum<input type="date" id="fd"></label>
<div class="two" data-for="e"><label>Beginn<input type="time" id="fs"></label><label>Ende<input type="time" id="fe"></label></div>
<label class="chk" data-for="e"><input type="checkbox" id="fa"> Ganztägig</label>
<label data-for="e">Ort<input id="fp"></label>
<label data-for="e">Kategorie<select id="fc"><option value="0">Schule</option><option value="1">Sport</option><option value="2">Privat</option><option value="3">Sonstiges</option></select></label>
<label data-for="t">Priorität<select id="fr"><option value="0">Hoch</option><option value="1">Normal</option><option value="2">Niedrig</option></select></label>
<label>Notizen<textarea id="fn" rows="3"></textarea></label>
<div class="btns"><button type="button" class="danger" id="del">Löschen</button><span></span><button type="button" class="sec" id="cx">Abbrechen</button><button class="pri">Speichern</button></div>
</form></dialog>
<script src="app.js"></script></body></html>
